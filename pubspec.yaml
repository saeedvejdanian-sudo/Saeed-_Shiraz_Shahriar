name: family_fund
description: برنامه مدیریت ساختمان شهریار
version: 3.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  pdf: ^3.10.0
  path_provider: ^2.1.0
  intl: ^0.18.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.2.0
  shamsi_date: ^1.0.2
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
  fonts:
    - family: BNazanin
      fonts:
        - asset: assets/fonts/BNazanin.ttf
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/shahriar_logo.png"
  adaptive_icon_background: "#0D1B2A"
  adaptive_icon_foreground: "assets/images/shahriar_logo.png"
  min_sdk_android: 21